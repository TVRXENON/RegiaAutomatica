{% extends "base.html" %}
{% block title %}Accesso{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login">
    <div class="tallyline" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="mark">{{ station }}</div>
    <p class="mark-sub">Regia automatica</p>
    <form method="post" class="panel" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
      <label class="field"><span>Nome utente</span>
        <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value="{{ request.form.get('username','') }}">
      </label>
      <label class="field"><span>Password</span>
        <div class="pw">
          <input type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="icon-btn eye" data-eye aria-label="Mostra la password" title="Mostra la password"><svg><use href="#i-eye"/></svg></button>
        </div>
      </label>
      <label class="check"><input type="checkbox" name="remember" value="1" checked> Ricorda su questo computer</label>
      <button class="btn primary" type="submit">Entra</button>
    </form>
  </div>
</div>
{% endblock %}
